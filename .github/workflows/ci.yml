name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. quick successive pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repository, so every job gets a read-only token.
# Actions are pinned to full commit SHAs (tag in the comment), so a moved tag
# cannot change the code that runs here.
permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22 is the floor declared in go.mod; oldstable and stable are the
        # two releases the Go team supports.
        go: ['1.22', oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Tests (race detector)
        run: go test -race -count=1 ./...
